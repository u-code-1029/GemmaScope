name: Desktop validation and installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Prepare standalone Python
        shell: bash
        run: |
          uv python install 3.12
          PYTHON_BIN="$(uv python find 3.12)"
          RUNTIME_DIR="$("$PYTHON_BIN" -c 'import sys; print(sys.base_prefix)')"
          npm run runtime:prepare -- --from "$RUNTIME_DIR"
      - run: npm ci --no-audit --no-fund
      - name: Python integration tests
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r backend/requirements-ml.txt
          uv run --no-project --python .venv python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaScope-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
